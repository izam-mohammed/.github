<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-labelledby="t d">
  <title id="t">.github</title>
  <desc id="d">A school report card for your pull request. Secrets, marked by gitleaks: F, circled in red, expelled, merge blocked. Dependencies, osv-scanner: C minus, hangs out with old versions, noted. Code, semgrep: B, mildly concerning, noted. Workflows, zizmor: A minus with a gold star, brave yaml, noted. Footnote: only one subject can hold you back, the rest get a letter home, which is a pull request comment.</desc>

  <defs>
    <pattern id="ruled" width="1200" height="34" patternUnits="userSpaceOnUse" y="6">
      <line x1="0" y1="33" x2="1200" y2="33" stroke="#1f252d" stroke-width="1.5"/>
    </pattern>
  </defs>

  <!-- the paper -->
  <rect x="16" y="12" width="1168" height="376" rx="10" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <rect x="17" y="130" width="1166" height="200" fill="url(#ruled)"/>
  <line x1="86" y1="13" x2="86" y2="387" stroke="#6e3b3b" stroke-width="2"/>
  <g fill="#0d1117" stroke="#30363d" stroke-width="2">
    <circle cx="50" cy="90" r="11"/><circle cx="50" cy="200" r="11"/><circle cx="50" cy="310" r="11"/>
  </g>

  <!-- header -->
  <text x="116" y="74" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" letter-spacing="3" fill="#e6edf3">REPORT CARD</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" fill="#9da7b3">
    <text x="118" y="104">student: your pull request · term: every push · school: .github (shared ci)</text>
  </g>

  <!-- the grades -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#9da7b3" letter-spacing="2">
    <text x="118" y="150">SUBJECT</text>
    <text x="330" y="150">TEACHER</text>
    <text x="528" y="150">GRADE</text>
    <text x="660" y="150">TEACHER'S COMMENT</text>
  </g>
  <line x1="116" y1="160" x2="1150" y2="160" stroke="#8b949e" stroke-width="1.5"/>

  <g font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#e6edf3">
    <text x="118" y="196">secrets</text>
    <text x="118" y="230">dependencies</text>
    <text x="118" y="264">code</text>
    <text x="118" y="298">workflows</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" fill="#9da7b3">
    <text x="330" y="196">gitleaks</text>
    <text x="330" y="230">osv-scanner</text>
    <text x="330" y="264">semgrep</text>
    <text x="330" y="298">zizmor</text>
  </g>

  <!-- red pen -->
  <g font-family="'Bradley Hand', 'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-weight="700" fill="#ff7b72">
    <text x="548" y="200" font-size="30" text-anchor="middle">F</text>
    <text x="552" y="232" font-size="24" text-anchor="middle">C-</text>
    <text x="550" y="266" font-size="24" text-anchor="middle">B</text>
    <text x="552" y="300" font-size="24" text-anchor="middle">A-</text>
  </g>
  <ellipse cx="549" cy="189" rx="24" ry="19" fill="none" stroke="#ff7b72" stroke-width="2.5" transform="rotate(-8 549 189)"/>

  <!-- the gold star, for the yaml -->
  <polygon transform="translate(592 290) rotate(12) scale(0.9)" points="0,-15 4.4,-5.4 14.3,-4.6 6.9,2.6 8.8,12.1 0,7 -8.8,12.1 -6.9,2.6 -14.3,-4.6 -4.4,-5.4" fill="#e3b341" stroke="#9e6a03" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- blue pen -->
  <g font-family="'Bradley Hand', 'Segoe Print', 'Chalkboard SE', 'Comic Sans MS', cursive" font-size="21" fill="#79c0ff">
    <text x="660" y="196" fill="#ff7b72" font-weight="700">expelled. merge blocked.</text>
    <text x="660" y="230">hangs out with old versions. noted.</text>
    <text x="660" y="264">mildly concerning. noted.</text>
    <text x="660" y="298">brave yaml. noted.</text>
  </g>

  <!-- the bit the parents read -->
  <text x="118" y="356" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="19" fill="#9da7b3">only one subject can hold you back. the rest get a letter home (a pr comment).</text>
  <path d="M900 352 c10 -22 20 -22 18 -2 c-2 14 10 -18 22 -10 c8 6 -4 16 6 12 c14 -6 22 -20 34 -14 c8 4 0 14 12 10 c10 -4 24 -12 40 -8" fill="none" stroke="#79c0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="890" y1="362" x2="1150" y2="362" stroke="#9da7b3" stroke-width="1"/>
  <text x="1150" y="378" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" fill="#9da7b3">gitleaks, head of discipline</text>
</svg>
